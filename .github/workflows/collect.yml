# 30분마다 부산 문화 정보 수집 → 디스코드 알림(밤엔 모아서 아침에) → 7일 요약 Gist 갱신
# 키·웹훅은 저장소 Secrets 의 BCA_CONFIG(config.json 전체) 에만 있고 코드에는 없다.
name: collect
on:
  schedule:
    - cron: '7,37 * * * *' # 정각은 GitHub 예약 실행이 몰려 늦어지므로 피함 (UTC 기준, 30분 간격이라 상관없음)
  workflow_dispatch: # 캘린더의 새로고침 버튼이 이걸로 바로 실행
concurrency:
  group: collect
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: config.json 만들기 (Secrets 에서)
        env:
          BCA_CONFIG: ${{ secrets.BCA_CONFIG }}
        run: |
          if [ -z "$BCA_CONFIG" ]; then echo "Secrets 에 BCA_CONFIG 가 없습니다"; exit 1; fi
          printf '%s' "$BCA_CONFIG" > config.json
      - name: 수집·알림·Gist 갱신
        env:
          TZ: Asia/Seoul
        run: node src/index.mjs --cloud
